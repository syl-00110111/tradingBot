[package]
name = "botv5"
version = "0.1.0"
edition = "2021"
authors = ["CCXT Trading Bot Team"]
description = "Cryptocurrencies multiplatform trading bot rewritten in Rust"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json"] }
rayon = "1.10"
ndarray = "0.15"
clap = { version = "4.5", features = ["derive"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
futures = "0.3"
